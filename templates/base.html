<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Wimbi{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/1.9.12/htmx.min.js"></script>
    <style>
        /* Palette per the dataviz skill's validated default (references/palette.md) —
           light mode only for this internal pass, dark mode deferred. */
        :root {
            --surface-1: #fcfcfb;
            --page-plane: #f9f9f7;
            --text-primary: #0b0b0b;
            --text-secondary: #52514e;
            --text-muted: #898781;
            --gridline: #e1e0d9;
            --baseline: #c3c2b7;
            --series-1: #2a78d6;
            --border: rgba(11, 11, 11, 0.10);
        }
        body {
            background: var(--page-plane);
            color: var(--text-primary);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="min-h-screen flex">
    {% if request.user.is_authenticated %}
    <aside class="w-56 shrink-0 border-r flex flex-col h-screen sticky top-0"
           style="border-color: var(--border); background: var(--surface-1);">
        <div>
            <div class="p-4 text-lg font-semibold">Wimbi</div>
            <nav class="px-2 space-y-1" hx-boost="true">
                <a href="{% url 'dashboard_page' %}" class="block px-3 py-2 rounded-md text-sm hover:bg-black/5">Dashboard</a>
                <a href="{% url 'search_page' %}" class="block px-3 py-2 rounded-md text-sm hover:bg-black/5">Search</a>
                <a href="{% url 'dataset_list' %}" class="block px-3 py-2 rounded-md text-sm hover:bg-black/5">Upload data</a>
            </nav>
        </div>
        <div class="mt-auto p-4 border-t text-sm" style="border-color: var(--border);">
            <div class="font-medium">{{ session_user.name }}</div>
            <div style="color: var(--text-secondary);">{{ session_user.department }} · {{ session_user.country }}</div>
            <form method="post" action="{% url 'logout_page' %}" class="mt-2">
                {% csrf_token %}
                <button type="submit" class="text-sm underline" style="color: var(--text-secondary);">Log out</button>
            </form>
        </div>
    </aside>
    {% endif %}
    <main class="flex-1 p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
