{% extends "base.html" %}
{% block title %}Log in · Wimbi{% endblock %}
{% block content %}
<div class="min-h-screen w-full flex items-center justify-center -m-6">
  <div class="w-full max-w-sm p-8 rounded-lg border" style="border-color: var(--border); background: var(--surface-1);">
    <h1 class="text-xl font-semibold mb-1">Wimbi</h1>
    <p class="text-sm mb-6" style="color: var(--text-secondary);">Farmer 360 — sign in with your OAF email</p>
    {% if error %}
      <div class="mb-4 text-sm rounded-md px-3 py-2" style="background: var(--error-bg); color: var(--error);">{{ error }}</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input type="email" name="email" id="email" required autofocus value="{{ email|default:'' }}"
             class="w-full rounded-md border px-3 py-2 mb-4 text-sm" style="border-color: var(--baseline);">
      <button type="submit" class="w-full rounded-md py-2 text-sm font-medium text-white" style="background: var(--series-1);">
        Continue
      </button>
    </form>
  </div>
</div>
{% endblock %}
